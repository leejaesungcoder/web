# Render 배포 설정 (Blueprint). Render 대시보드에서 New → Blueprint로 이 저장소를 연결하면
# rap-reaction/ 폴더가 무료 웹 서비스로 배포된다. Docker는 쓰지 않는다.
services:
  - type: web
    name: rap-reaction
    runtime: python
    plan: free
    rootDir: rap-reaction
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ANTHROPIC_API_KEY
        sync: false   # 배포할 때 Render 화면에서 직접 입력
      - key: APP_ACCESS_CODE
        sync: false   # 선택: 비워 두면 누구나 사용 가능
      - key: YOUTUBE_API_KEY
        sync: false   # 선택: 유튜브 링크 분석에 필요 (YouTube Data API v3 키)
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: DAILY_LIMIT
        value: "200"
