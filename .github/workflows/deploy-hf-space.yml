# rap-reaction/ 폴더를 Hugging Face Space에 배포한다.
#
# 준비 (저장소 Settings → Secrets and variables → Actions):
#   Secrets   HF_TOKEN  Hugging Face 액세스 토큰 (Write 권한)
#   Variables HF_SPACE  배포할 Space 이름, 예: my-name/rap-reaction
# HF_SPACE가 없으면 아무것도 하지 않는다.

name: Deploy Rap Reaction to Hugging Face

on:
  push:
    branches: [main]
    paths: ["rap-reaction/**"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "huggingface_hub>=0.34"
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path="rap-reaction",
              ignore_patterns=["data/*.jsonl", "__pycache__/*", "**/__pycache__/*", ".numba_cache/*"],
              delete_patterns=["app/**", "collector/**"],
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}",
          )
          EOF
